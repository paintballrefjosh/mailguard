# MailGuard Docker Compose
services:
  # ── MariaDB ────────────────────────────────────────────────────────────────
  mariadb:
    build: ./mariadb
    container_name: mailguard-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mailguard]

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: mailguard-api
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
      clamav:  { condition: service_healthy }
    env_file: .env
    environment:
      POSTFIX_CONTAINER: mailguard-postfix
      AMAVIS_CONTAINER: mailguard-amavis
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./postfix/maps-dynamic:/mailguard/maps-dynamic
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mailguard]

  # ── Frontend Dashboard ─────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: mailguard-ui
    restart: unless-stopped
    depends_on: [backend]
    networks: [mailguard]

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mailguard-nginx
    restart: unless-stopped
    ports:
      - "8010:80"
      - "8011:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on: [frontend, backend]
    networks: [mailguard]

  # ── ClamAV ────────────────────────────────────────────────────────────────
  # Must be healthy before Amavis starts — Amavis connects via TCP on port 3310
  clamav:
    image: clamav/clamav-debian:1.5
    container_name: mailguard-clamav
    restart: unless-stopped
    volumes:
      - ./data/clamav:/var/lib/clamav
      - ./logs/clamav:/var/log/clamav
    networks: [mailguard]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 120s   # ClamAV needs time to load virus databases

  # ── Amavis (spam + virus content filter) ──────────────────────────────────
  # Depends on ClamAV being healthy — connects via TCP clamav:3310
  amavis:
    build: ./amavis
    container_name: mailguard-amavis
    restart: unless-stopped
    depends_on:
      clamav:  { condition: service_healthy }
      backend: { condition: service_started }
    env_file: .env
    volumes:
      - ./data/amavis:/var/lib/amavis
      - ./logs/amavis:/var/log/amavis
      - ./amavis/entrypoint.sh:/entrypoint.sh
      - ./amavis/amavis.conf:/etc/amavis/conf.d/99-mailguard
      - ./amavis/spamassassin.conf:/etc/spamassassin/local.cf
      # Read-only view of the backend-generated body_checks so the entrypoint
      # can mirror body block/hold rules into SpamAssassin (decoded scanning).
      - ./postfix/maps-dynamic:/mailguard/maps-dynamic:ro
    networks: [mailguard]
    # Healthcheck: nc against port 10024 which Amavis binds directly
    # (hex 2748 = 10024 — previous config checked 0x2728 which was wrong)
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10024"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ── MailGuard compound-rule milter ─────────────────────────────────────────
  # Enforces multi-condition rules (e.g. From: domain AND body content) at SMTP
  # time — a hard 5xx reject Postfix's header/body_checks maps can't express.
  # Reads compound_rules.json (generated by the backend into maps-dynamic) and
  # hot-reloads on change. Postfix fails open if this is down.
  milter:
    build: ./milter
    container_name: mailguard-milter
    restart: unless-stopped
    volumes:
      - ./postfix/maps-dynamic:/mailguard/maps-dynamic:ro
    networks: [mailguard]

  # ── Postfix SMTP Proxy ─────────────────────────────────────────────────────
  # Depends on Amavis being healthy before starting — content_filter is active
  postfix:
    build: ./postfix
    container_name: mailguard-postfix
    restart: unless-stopped
    depends_on:
      amavis:  { condition: service_healthy }
      backend: { condition: service_started }
      milter:  { condition: service_started }
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - ./postfix/maps:/mailguard/maps
      - ./postfix/maps-dynamic:/etc/postfix/maps-dynamic
      - postfix_spool:/var/spool/postfix
      - ./logs/mail:/var/log/mail
      - ./certs:/certs:ro
    env_file: .env
    networks: [mailguard]

  # ── SpamAssassin ──────────────────────────────────────────────────────────
  spamassassin:
    image: instantlinux/spamassassin:latest
    container_name: mailguard-spamassassin
    restart: unless-stopped
    volumes:
      - ./spamassassin/local.cf:/etc/spamassassin/local.cf:ro
      - ./data/spamassassin:/var/lib/spamassassin
    networks: [mailguard]

networks:
  mailguard:
    driver: bridge
volumes:
  postfix_spool: