events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  gzip on; gzip_types text/plain application/json application/javascript text/css;

  # Docker's internal DNS — re-resolves hostnames every 10s so container
  # rebuilds are picked up automatically without reloading nginx
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HTTP — plain, no redirect
  server {
    listen 80;
    server_name _;

    location /ws {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600;
    }
    location /api {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      set $frontend http://frontend:80;
      proxy_pass $frontend;
      proxy_set_header Host $host;
      # Tell browser not to cache the HTML index — always fetch fresh
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
    }
  }

  # HTTPS — optional, only used if certs exist and user hits this port
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /ws {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600;
    }
    location /api {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      set $frontend http://frontend:80;
      proxy_pass $frontend;
      proxy_set_header Host $host;
    }
  }
}